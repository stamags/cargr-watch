name: car.gr Morning Brief

on:
  schedule:
    # Fire at 05:07, 06:07, 07:07 UTC. Off-the-hour dodges GitHub's top-of-hour
    # congestion (which delays/drops scheduled runs). The Python send-once-per-day
    # guard makes the first fire at/after 08:00 Athens send, the rest skip — so it
    # lands at 08:00 in BOTH DST seasons and survives a delayed/missed tick.
    - cron: '7 5-7 * * *'
  workflow_dispatch:        # manual "Run workflow" button (baseline / on-demand)

permissions:
  contents: write           # allow committing state.json back to the repo

concurrency:
  group: cargr-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the brief
        env:
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          # Manual runs bypass the once-per-day / time-of-day guard so testing always sends.
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 cargr_brief.py

      - name: Commit updated state
        run: |
          git config user.name "cargr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git commit -m "state: $(TZ=Europe/Athens date +%F)"
            git push
          fi
